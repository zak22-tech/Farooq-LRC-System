<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة الحجوزات</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial;background:#f3f7f4;color:#1f2937}header{background:#065f46;color:white;padding:18px}.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#fff;border:1px solid #d1fae5;border-radius:18px;padding:18px;box-shadow:0 12px 35px #064e3b12}.wide{grid-column:1/-1}h2{margin-top:0}input,select,button{font:inherit;padding:10px;border:1px solid #d1d5db;border-radius:10px}button{cursor:pointer;font-weight:700}.primary{background:#0f7a3a;color:#fff;border:0}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1;min-width:130px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:right}.scroll{overflow:auto}.msg{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#065f46;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:10}@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div id="msg" class="msg"></div><header><div class="wrap top"><div><b>لوحة مدير نظام حجز القاعات</b><div id="userEmail"></div></div><div><a href="./index.html" style="color:white">الموقع</a> <button id="logout">خروج</button></div></div></header><main class="wrap"><div class="grid"><section class="card"><h2>إغلاق قاعة أو موعد</h2><form id="blockForm"><div class="row"><select id="blockHall"><option value="">كل القاعات</option><option>مركز مصادر التعلم</option><option>مختبر الأحياء</option><option>مختبر الكيمياء</option></select><input id="blockDate" type="date"><select id="blockPeriod"><option value="">كل الحصص</option></select></div><div class="row"><input id="blockReason" placeholder="سبب الإغلاق"><button class="primary">إضافة الإغلاق</button></div></form><div id="blocks"></div></section><section class="card"><h2>مسؤولو القاعات والتنبيهات</h2><form id="managerForm"><div class="row"><select id="managerHall" required><option>مركز مصادر التعلم</option><option>مختبر الأحياء</option><option>مختبر الكيمياء</option></select><input id="managerName" placeholder="اسم المسؤول" required></div><div class="row"><input id="managerEmail" type="email" placeholder="البريد الإلكتروني"><input id="managerPhone" placeholder="رقم واتساب بصيغة دولية"></div><button class="primary">حفظ البيانات</button></form><div id="managers"></div></section><section class="card wide"><h2>تقارير الحجوزات</h2><div class="row"><select id="range"><option value="day">اليوم</option><option value="week">الأسبوع الحالي</option><option value="month">الشهر الحالي</option><option value="all">كل السجل</option></select><button id="csv">تنزيل CSV</button><button id="print">طباعة / حفظ PDF</button></div></section><section class="card wide"><h2>إدارة الحجوزات</h2><div class="row"><input id="search" placeholder="بحث بالقاعة أو المعلم أو التاريخ"><select id="status"><option value="all">جميع الحجوزات</option><option value="future">القادمة</option><option value="past">السابقة</option></select></div><div class="scroll"><table><thead><tr><th>التاريخ</th><th>القاعة</th><th>الحصة</th><th>المعلم</th><th>الصف</th><th>المادة</th><th>الإجراء</th></tr></thead><tbody id="bookingRows"></tbody></table></div></section></div></main><script type="module" src="./admin.js"></script></body></html>
