<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الإدارة</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial;background:linear-gradient(135deg,#064e3b,#0f7a3a);min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(430px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 25px 70px #0005}h1{margin-top:0;color:#065f46}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:12px;background:#0f7a3a;color:#fff;font:inherit;font-weight:800;cursor:pointer}.msg{min-height:24px;color:#b91c1c;margin-top:12px}.back{display:block;text-align:center;margin-top:15px;color:#047857}</style></head><body><form class="box" id="form"><h1>دخول مدير النظام</h1><p>سجّل الدخول بحساب المدير المسجّل في Firebase Authentication.</p><label>البريد الإلكتروني</label><input id="email" type="email" required autocomplete="username"><label>كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"><button>تسجيل الدخول</button><div id="msg" class="msg"></div><a class="back" href="./index.html">العودة للموقع</a></form><script type="module">import{auth}from'./firebase.js';import{signInWithEmailAndPassword,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';onAuthStateChanged(auth,u=>{if(u)location.replace('./admin.html')});form.onsubmit=async e=>{e.preventDefault();msg.textContent='جارٍ التحقق...';try{await signInWithEmailAndPassword(auth,email.value.trim(),password.value);location.replace('./admin.html')}catch(err){msg.textContent='بيانات الدخول غير صحيحة أو الحساب غير مفعّل.'}}</script></body></html>
